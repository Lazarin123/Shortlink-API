<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShortLink — encurte e acompanhe</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#8b90a0; --accent:#7c5cff; --ok:#2ecc8f; --err:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6fa; --card:#fff; --text:#161821; --muted:#6a6f80; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  main { max-width:680px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:2rem; margin:0 0 4px; } h1 span { color:var(--accent); }
  p.sub { color:var(--muted); margin:0 0 28px; }
  .card { background:var(--card); border-radius:14px; padding:22px; margin-bottom:20px; border:1px solid #8883; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:11px 13px; border-radius:9px; border:1px solid #8885; background:transparent; color:inherit; font:inherit; }
  button { margin-top:16px; padding:11px 18px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid #8885; color:inherit; margin-left:6px; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  .result { margin-top:16px; padding:12px; border-radius:9px; background:#7c5cff1f; word-break:break-all; }
  .result a { color:var(--accent); font-weight:600; }
  .err { color:var(--err); margin-top:12px; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:16px 0; }
  .stat { padding:14px; border-radius:10px; background:#8881; } .stat b { font-size:1.6rem; display:block; }
  .bars { display:flex; align-items:flex-end; gap:4px; height:90px; margin:12px 0 4px; }
  .bars div { flex:1; background:var(--accent); border-radius:4px 4px 0 0; min-height:3px; }
  small { color:var(--muted); } ul { padding-left:18px; margin:6px 0; }
</style>
</head>
<body>
<main>
  <h1>Short<span>Link</span></h1>
  <p class="sub">Cole um link longo, receba um curtinho e acompanhe cada clique.</p>

  <section class="card">
    <label for="url">URL longa</label>
    <input id="url" type="url" placeholder="https://exemplo.com/um/caminho/bem/grande?com=parametros">
    <div class="row">
      <div><label for="alias">Alias (opcional)</label><input id="alias" placeholder="meu-link"></div>
      <div><label for="exp">Expira em (opcional)</label><input id="exp" type="datetime-local"></div>
    </div>
    <button id="go">Encurtar</button>
    <div id="out"></div>
  </section>

  <section class="card">
    <label for="code">Ver métricas de um código</label>
    <input id="code" placeholder="ex: meu-link">
    <button id="stat">Consultar</button>
    <div id="statsOut"></div>
  </section>
</main>

<script>
  // Para usar este front em OUTRO site, troque por a URL da sua API: const API = 'https://seu-app.onrender.com';
  const API = '';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  $('go').onclick = async () => {
    const body = { url: $('url').value.trim() };
    if ($('alias').value.trim()) body.alias = $('alias').value.trim();
    if ($('exp').value) body.expiresAt = new Date($('exp').value).toISOString();
    try {
      const r = await fetch(API + '/api/links', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      $('out').innerHTML = `<div class="result"><a href="${esc(d.shortUrl)}" target="_blank">${esc(d.shortUrl)}</a>
        <button class="ghost" id="copy">Copiar</button></div>`;
      $('copy').onclick = () => { navigator.clipboard.writeText(d.shortUrl); $('copy').textContent = 'Copiado!'; };
      $('code').value = d.code;
    } catch (e) { $('out').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };

  $('stat').onclick = async () => {
    try {
      const r = await fetch(`${API}/api/links/${encodeURIComponent($('code').value.trim())}/stats`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      const max = Math.max(1, ...d.clicksByDay.map((x) => x.clicks));
      const list = (a) => a.length ? `<ul>${a.map((x) => `<li>${esc(x.name)} — ${x.clicks}</li>`).join('')}</ul>` : '<small>sem dados</small>';
      $('statsOut').innerHTML = `
        <div class="stats">
          <div class="stat"><b>${d.totalClicks}</b>cliques</div>
          <div class="stat"><b>${d.uniqueVisitors}</b>visitantes únicos</div>
        </div>
        <small>Cliques por dia (30 dias)</small>
        <div class="bars">${d.clicksByDay.map((x) => `<div title="${x.date}: ${x.clicks}" style="height:${x.clicks / max * 100}%"></div>`).join('')}</div>
        <div class="row"><div><b>Origens</b>${list(d.topReferrers)}</div><div><b>Dispositivos</b>${list(d.devices)}</div></div>
        <small>Destino: ${esc(d.url)}</small>`;
    } catch (e) { $('statsOut').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
</script>
</body>
</html>
